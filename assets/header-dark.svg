<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Top Right Cyan Glow -->
    <radialGradient id="glowTR" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Left Emerald Glow -->
    <radialGradient id="glowBL" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.22" />
    </pattern>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', Roboto, sans-serif; }
    .pulse { animation: pulseAnim 2.5s infinite; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.4; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#grid)" />
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#glowTR)" />
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#glowBL)" />

  <!-- Status Micro-Pill -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="345" height="26" rx="13" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" class="pulse" />
    <text x="26" y="17" fill="#cbd5e1" class="mono" font-size="11" font-weight="500" letter-spacing="0.3">
      OPEN TO AI/ML &amp; SWE ROLES (2026 - 2027)
    </text>
  </g>

  <!-- Headline: Laxmi Sanas -->
  <text x="36" y="104" fill="url(#nameGrad)" class="serif" font-size="46" font-weight="400" letter-spacing="-0.5">
    Laxmi Sanas
  </text>

  <!-- Role Subtitle -->
  <g transform="translate(36, 134)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="14.5" font-weight="600">
      AI &amp; Data Science Engineer
    </text>
    <text x="238" y="0" fill="#64748b" class="sans" font-size="14">|</text>
    <text x="252" y="0" fill="#e2e8f0" class="sans" font-size="14" font-weight="500">
      Full-Stack Developer &amp; ML Researcher
    </text>
  </g>

  <!-- Value Statement -->
  <text x="36" y="166" fill="#94a3b8" class="sans" font-size="13" font-weight="400">
    Undergraduate researcher building algorithmic recourse models, distributed pipelines, and production systems.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(36, 192)">
    <!-- Badge 1: Academic Rank -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="246" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <!-- Trophy Icon -->
      <path d="M 14 9 L 22 9 L 22 14 C 22 16.5 20 18 18 18 C 16 18 14 16.5 14 14 Z M 18 18 L 18 22 M 15 22 L 21 22" stroke="#f59e0b" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="20" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">
        SITRC Rank 1 • CGPA 9.34 / 10
      </text>
    </g>

    <!-- Badge 2: Repositories -->
    <g transform="translate(258, 0)">
      <rect x="0" y="0" width="232" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <!-- Code Repo Icon -->
      <path d="M 14 13 L 18 9 L 14 5 M 22 13 L 26 9 L 22 5" transform="translate(0, 4)" stroke="#38bdf8" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="20" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">
        65+ Public GitHub Repos
      </text>
    </g>

    <!-- Badge 3: NASA Space Apps -->
    <g transform="translate(502, 0)">
      <rect x="0" y="0" width="304" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <!-- Star / Rocket Icon -->
      <polygon points="18,8 20,13 25,13 21,16 23,21 18,18 13,21 15,16 11,13 16,13" fill="#a855f7" />
      <text x="32" y="20" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">
        NASA Space Apps Global Nominee (Top 10%)
      </text>
    </g>
  </g>
</svg>
