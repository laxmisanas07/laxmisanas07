<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Ambient Glow Top Right -->
    <radialGradient id="glowTR" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow Bottom Left -->
    <radialGradient id="glowBL" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient for Name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .serif { font-family: 'Instrument Serif', 'Fraunces', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', Roboto, sans-serif; }
    .status-pulse { animation: pulse 2.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#grid)" />
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#glowTR)" />
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#glowBL)" />

  <!-- Status Micro-Pill -->
  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="418" height="26" rx="13" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" class="status-pulse" />
    <text x="26" y="17" fill="#cbd5e1" class="mono" font-size="11.5" font-weight="500" letter-spacing="0.2">
      STATUS: OPEN TO AI/ML &amp; SWE ROLES — 2027
    </text>
  </g>

  <!-- Headline: Laxmi Sanas (Using Instrument Serif) -->
  <text x="36" y="112" fill="url(#nameGrad)" class="serif" font-size="48" font-weight="400" letter-spacing="-0.5">
    Laxmi Sanas
  </text>

  <!-- Role Subtitle -->
  <g transform="translate(36, 142)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="14.5" font-weight="600" letter-spacing="-0.1">
      AI &amp; Data Science Engineer
    </text>
    <text x="215" y="0" fill="#64748b" class="sans" font-size="14">|</text>
    <text x="230" y="0" fill="#e2e8f0" class="sans" font-size="14" font-weight="500">
      Full-Stack Developer &amp; ML Researcher
    </text>
  </g>

  <!-- Value Statement -->
  <text x="36" y="176" fill="#94a3b8" class="sans" font-size="13" font-weight="400">
    Undergraduate researcher building algorithmic recourse models, distributed pipelines, and production systems.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(36, 204)">
    <!-- Badge 1: Academic Rank -->
    <rect x="0" y="0" width="246" height="30" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="12" y="19" fill="#f59e0b" font-size="12">🏆</text>
    <text x="32" y="19" fill="#e5e7eb" class="mono" font-size="11" font-weight="500">
      SITRC Rank 1 • CGPA 9.34 / 10
    </text>

    <!-- Badge 2: Repositories -->
    <rect x="258" y="0" width="232" height="30" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="270" y="19" fill="#38bdf8" font-size="12">⚡</text>
    <text x="290" y="19" fill="#e5e7eb" class="mono" font-size="11" font-weight="500">
      65+ Public GitHub Repos
    </text>

    <!-- Badge 3: NASA Space Apps -->
    <rect x="502" y="0" width="294" height="30" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="514" y="19" fill="#a855f7" font-size="12">🚀</text>
    <text x="534" y="19" fill="#e5e7eb" class="mono" font-size="11" font-weight="500">
      NASA Space Apps Global Nominee (Top 10%)
    </text>
  </g>
</svg>

