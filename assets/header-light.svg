<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250" fill="none">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9" />
      <stop offset="60%" stop-color="#f5f2eb" />
      <stop offset="100%" stop-color="#ece7dc" />
    </linearGradient>

    <radialGradient id="glowLightTR" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#1f4d3a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f5f2eb" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4d3a" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#d9d5ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f4d3a" stop-opacity="0.25" />
    </linearGradient>

    <pattern id="gridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6b6b6b" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .pulse { animation: pulseAnim 2.5s infinite; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.4; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#bgLight)" stroke="url(#borderLight)" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#gridLight)" />
  <rect x="2" y="2" width="876" height="246" rx="16" fill="url(#glowLightTR)" />

  <!-- Status Micro-Pill -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="345" height="26" rx="13" fill="#ffffff" fill-opacity="0.9" stroke="#d9d5ca" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#1f4d3a" class="pulse" />
    <text x="26" y="17" fill="#141414" class="mono" font-size="11" font-weight="600" letter-spacing="0.3">
      OPEN TO AI/ML &amp; SWE ROLES (2026 - 2027)
    </text>
  </g>

  <!-- Headline: Laxmi Sanas -->
  <text x="36" y="104" fill="#141414" class="serif" font-size="46" font-weight="400" letter-spacing="-0.5">
    Laxmi Sanas
  </text>

  <!-- Role Subtitle -->
  <g transform="translate(36, 134)">
    <text x="0" y="0" fill="#1f4d3a" class="mono" font-size="14.5" font-weight="700">
      AI &amp; Data Science Engineer
    </text>
    <text x="238" y="0" fill="#6b6b6b" class="sans" font-size="14">|</text>
    <text x="252" y="0" fill="#2d3748" class="sans" font-size="14" font-weight="600">
      Full-Stack Developer &amp; ML Researcher
    </text>
  </g>

  <!-- Value Statement -->
  <text x="36" y="166" fill="#4a5568" class="sans" font-size="13" font-weight="400">
    Undergraduate researcher building algorithmic recourse models, distributed pipelines, and production systems.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(36, 192)">
    <!-- Badge 1: Academic Rank -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="246" height="32" rx="8" fill="#ffffff" stroke="#d9d5ca" stroke-width="1" />
      <path d="M 14 9 L 22 9 L 22 14 C 22 16.5 20 18 18 18 C 16 18 14 16.5 14 14 Z M 18 18 L 18 22 M 15 22 L 21 22" stroke="#b45309" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="20" fill="#141414" class="mono" font-size="11" font-weight="600">
        SITRC Rank 1 • CGPA 9.34 / 10
      </text>
    </g>

    <!-- Badge 2: Repositories -->
    <g transform="translate(258, 0)">
      <rect x="0" y="0" width="232" height="32" rx="8" fill="#ffffff" stroke="#d9d5ca" stroke-width="1" />
      <path d="M 14 13 L 18 9 L 14 5 M 22 13 L 26 9 L 22 5" transform="translate(0, 4)" stroke="#1f4d3a" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="20" fill="#141414" class="mono" font-size="11" font-weight="600">
        65+ Public GitHub Repos
      </text>
    </g>

    <!-- Badge 3: NASA Space Apps -->
    <g transform="translate(502, 0)">
      <rect x="0" y="0" width="304" height="32" rx="8" fill="#ffffff" stroke="#d9d5ca" stroke-width="1" />
      <polygon points="18,8 20,13 25,13 21,16 23,21 18,18 13,21 15,16 11,13 16,13" fill="#6b21a8" />
      <text x="32" y="20" fill="#141414" class="mono" font-size="11" font-weight="600">
        NASA Space Apps Global Nominee (Top 10%)
      </text>
    </g>
  </g>
</svg>
