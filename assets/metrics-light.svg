<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 100" width="100%" height="100" fill="none">
  <defs>
    <linearGradient id="cardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f3" />
      <stop offset="100%" stop-color="#f2ede2" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card 1: Repositories -->
  <g transform="translate(0, 0)">
    <rect x="1" y="1" width="208" height="96" rx="12" fill="url(#cardLight)" stroke="#d9d5ca" stroke-width="1.2" />
    <text x="20" y="32" fill="#1f4d3a" class="mono" font-size="11" font-weight="600" letter-spacing="1">CODEBASE</text>
    <text x="20" y="64" fill="#141414" class="sans" font-size="28" font-weight="800">65+</text>
    <text x="20" y="82" fill="#6b6b6b" class="sans" font-size="11">Public Repositories</text>
  </g>

  <!-- Card 2: Academic CGPA -->
  <g transform="translate(224, 0)">
    <rect x="1" y="1" width="208" height="96" rx="12" fill="url(#cardLight)" stroke="#d9d5ca" stroke-width="1.2" />
    <text x="20" y="32" fill="#1f4d3a" class="mono" font-size="11" font-weight="600" letter-spacing="1">ACADEMICS</text>
    <text x="20" y="64" fill="#141414" class="sans" font-size="28" font-weight="800">9.34</text>
    <text x="20" y="82" fill="#6b6b6b" class="sans" font-size="11">B.Tech CGPA • Rank 1</text>
  </g>

  <!-- Card 3: Research Papers -->
  <g transform="translate(448, 0)">
    <rect x="1" y="1" width="208" height="96" rx="12" fill="url(#cardLight)" stroke="#d9d5ca" stroke-width="1.2" />
    <text x="20" y="32" fill="#1f4d3a" class="mono" font-size="11" font-weight="600" letter-spacing="1">RESEARCH</text>
    <text x="20" y="64" fill="#141414" class="sans" font-size="28" font-weight="800">2 Papers</text>
    <text x="20" y="82" fill="#6b6b6b" class="sans" font-size="11">Elsevier EAAI &amp; IJARSCT</text>
  </g>

  <!-- Card 4: Global Recognition -->
  <g transform="translate(672, 0)">
    <rect x="1" y="1" width="207" height="96" rx="12" fill="url(#cardLight)" stroke="#d9d5ca" stroke-width="1.2" />
    <text x="20" y="32" fill="#1f4d3a" class="mono" font-size="11" font-weight="600" letter-spacing="1">RECOGNITION</text>
    <text x="20" y="64" fill="#141414" class="sans" font-size="28" font-weight="800">Top 10%</text>
    <text x="20" y="82" fill="#6b6b6b" class="sans" font-size="11">NASA Space Apps Nominee</text>
  </g>
</svg>
